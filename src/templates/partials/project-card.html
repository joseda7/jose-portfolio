<figure class="gallery__item gallery__item--{{size}}">
    <button type="button" class="gallery__item-trigger" data-title="{{title}}" data-description="{{description}}" data-tags="{{{tagsJson}}}" data-images="{{{imagesJson}}}">
        <img src="{{image}}" alt="{{imageAlt}}" loading="lazy">
        <figcaption>
            <span class="gallery__item-tags">{{{tagsHtml}}}</span>
        </figcaption>
    </button>
</figure>
