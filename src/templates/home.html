<div class="layout">
    <section class="pane pane--content" aria-label="{{about.heading}}">
        <header class="pane-header">
            <img class="avatar" src="{{about.photo}}" alt="{{about.photoAlt}}" width="32" height="32">
            <div class="pane-header__meta fade-target">
                <span class="pane-header__name">{{hero.name}}</span>
                <a class="lang-switch" href="{{meta.alternateLangPath}}">{{nav.langSwitchLabel}}</a>
            </div>
        </header>

        <div class="essay fade-target">
            <div class="essay-body">
                {{{aboutParagraphsHtml}}}
                <audio class="song-audio" src="{{about.songSrc}}" controls preload="none"></audio>
            </div>
            <footer class="pane-footer">
                <a class="cv-link" href="{{footer.cvHref}}" download>{{footer.cvLabel}}</a>
                <a href="{{footer.tagHref}}" target="_blank">{{footer.tag}}</a>
                <p>{{footer.copyright}}</p>
            </footer>
        </div>
    </section>

    <nav class="category-nav" aria-label="{{projects.heading}}">
        <ul>
            {{{categoryNavHtml}}}
        </ul>
    </nav>

    <section class="pane pane--gallery" aria-label="{{projects.heading}}">
        <div class="gallery">
            {{{galleryHtml}}}
        </div>
    </section>

    <div class="song-overlay"></div>

    <div class="project-modal" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
        <button type="button" class="project-modal__close" aria-label="{{projects.closeLabel}}">&times;</button>
        <div class="project-modal__content">
            <div class="project-modal__info">
                <h2 class="project-modal__title" id="project-modal-title"></h2>
                <div class="project-modal__tags"></div>
                <p class="project-modal__description"></p>
            </div>
            <div class="project-modal__slider">
                <button type="button" class="project-modal__prev" aria-label="{{projects.prevLabel}}">&lsaquo;</button>
                <div class="project-modal__media"></div>
                <button type="button" class="project-modal__next" aria-label="{{projects.nextLabel}}">&rsaquo;</button>
            </div>
        </div>
    </div>
</div>
